# 예시일 뿐이다. 스킬은 이 파일을 적용하지 않는다.
# 실제 바인딩은 대상 프로젝트(예: <repo>/agent-context/workflow/bindings/<workflow-id>.yaml)에서 에이전트가 작성하고
#   compile_workflow.py <ttl> --bindings <그 파일> [--strict-bindings]
# 로 컴파일한다. 계약과 작성 절차는 references/bindings.md.
#
# 키는 TTL 노드의 local id 다(예: ex:collect -> collect). TTL 에 없는 키는 컴파일 오류.
# 대응하는 TTL 은 tests/test_compile_workflow.py 의 V07_TTL (collect -> check -> approve -> apply).
bindings:
  collect:
    kind: script                # 결정적 작업. 실행 시 state.execute=true 일 때만 실제로 돈다(기본 dry-run).
    run: ["python3", "scripts/collect.py", "--out", "build/collected.json"]   # argv 목록 또는 문자열
    cwd: .                      # 생략하면 state.cwd
    timeout: 300                # 초, 기본 600
    env: {EXAMPLE_FLAG: "1"}

  check:                        # decision 노드는 script 가 분기를 고른다.
    kind: script
    run: ["python3", "scripts/check.py"]
    decision:
      source: stdout_json       # exit_code | stdout_json
      key: ok                   # stdout JSON 의 키(source=stdout_json)
      map: {"true": "yes", "false": "no", default: "no"}   # 값은 TTL 분기 이름이어야 한다
    # exit code 로 고르려면: decision: {source: exit_code, map: {"0": "yes", default: "no"}}

  approve:
    kind: interrupt             # 사람 승인. 체크포인터가 있으면 멈췄다가 resume() 로 이어간다.

  apply:
    kind: agent                 # 모델/에이전트 작업. 직접 호출하지 않고 control plane 에 위임하고 멈춘다.
    session: fresh              # fresh = 작성자와 다른 새 세션(검증 분리가 필요할 때)
    expects: "변경 요약과 테스트 결과를 담은 JSON"
